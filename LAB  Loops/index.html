<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Contatos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #4f7bff 0%, transparent 40%),
                        radial-gradient(circle at bottom right, #4dd4ff 0%, transparent 35%),
                        linear-gradient(180deg, #070618 0%, #11142d 100%);
            min-height: 100vh;
            color: #eef2ff;
            padding: 20px;
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            flex: 1;
            min-width: 300px;
            padding: 32px;
            border-radius: 24px;
            background: rgba(15, 18, 39, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        .panel h2 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: #38d0ff;
            font-weight: 700;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #5d80ff 0%, #38d0ff 100%);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(56, 208, 255, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 208, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(56, 208, 255, 0.2);
        }

        .display-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            min-height: 120px;
            border: 1px solid rgba(56, 208, 255, 0.2);
            overflow-y: auto;
            max-height: 300px;
        }

        .contact-item {
            background: rgba(56, 208, 255, 0.08);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #38d0ff;
        }

        .contact-item strong {
            color: #38d0ff;
            display: block;
            margin-bottom: 4px;
        }

        .contact-item small {
            color: #b8c6ff;
            display: block;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #eef2ff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #38d0ff;
            box-shadow: 0 0 12px rgba(56, 208, 255, 0.2);
        }

        input::placeholder {
            color: #7a8aff;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            background: rgba(56, 208, 255, 0.1);
            border: 1px solid rgba(56, 208, 255, 0.2);
            color: #b8c6ff;
            font-size: 0.9rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            color: #7a8aff;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
            }

            .panel {
                min-width: 100%;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Painel de Consulta -->
        <div class="panel">
            <h2>📋 Consultar</h2>
            <div class="button-group">
                <button onclick="exibirPrimeiro()">Primeiro</button>
                <button onclick="exibirUltimo()">Último</button>
                <button onclick="exibirTodos()" class="full-width">Todos os Contatos</button>
            </div>
            <div class="display-area" id="displayArea">
                <div class="empty-state">Clique em um botão para exibir contatos</div>
            </div>
        </div>

        <!-- Painel de Adição -->
        <div class="panel">
            <h2>➕ Adicionar Contato</h2>
            <div id="statusMessage"></div>
            <div class="input-group">
                <input type="text" id="nome" placeholder="Nome completo">
                <input type="tel" id="telefone" placeholder="Telefone">
                <input type="email" id="email" placeholder="Email">
                <button onclick="adicionarContato()" class="full-width">Adicionar</button>
            </div>
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                <p style="color: #7a8aff; font-size: 0.9rem; margin-bottom: 10px;">Total de contatos:</p>
                <h3 style="color: #38d0ff; font-size: 2rem;" id="contador">3</h3>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
